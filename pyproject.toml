# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================
# Updated: 2026-10-16
#
# REQ: All Python src/ projects SHOULD include pyproject.toml.
# WHAT: Defines project identity, dependencies, and build configuration.
# WHY: Keeps Python project metadata and package requirements together.
# CUSTOM: Update project identity, dependencies, and package paths.

# ============================================================
# === SECTION: PROJECT IDENTITY ===
# ============================================================

[project]
description = "Executable contract for the Structural Explainability interpretive kernel: finite kernel, generated occurrence regime, thresholds, witnesses, and comparison-lifting laws"
dynamic = ["version"] # WHY: Version is computed from git tags at build time (see [tool.hatch.version]).
license = {file = "LICENSE"}
name = "se-interpretive-kernel"
readme = "README.md"
requires-python = ">=3.15"

# ============================================================
# === SECTION: PROJECT RUNTIME DEPENDENCIES ===
# ============================================================

dependencies = []


# ============================================================
# === SECTION: DEVELOPMENT AND DOCUMENTATION DEPENDENCIES ===
# ============================================================
# These packages support developing, testing, and documenting the project.
# They are not required to execute the project code.

[dependency-groups]
# WHY: Development and documentation tools support maintaining, validating,
#      and documenting the project without becoming runtime dependencies.

dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "ty"
]
docs = [
  "zensical",
  "mkdocstrings[python]", # WHY: Auto-generate API docs from docstrings.
]

[project.scripts]
se-interpretive-kernel = "se_interpretive_kernel.cli:main"

[project.urls]
Changelog = "https://github.com/structural-explainability/se-interpretive-kernel/blob/main/CHANGELOG.md"
Documentation = "https://structural-explainability.github.io/se-interpretive-kernel/"
Homepage = "https://github.com/structural-explainability/se-interpretive-kernel"
Issues = "https://github.com/structural-explainability/se-interpretive-kernel/issues"
Repository = "https://github.com/structural-explainability/se-interpretive-kernel"

# ============================================================
# === SECTION 2: TOOL CONFIGURATION ===
# ============================================================

# === MARKDOWNLINT (MARKDOWN LINTING) ===

[tool.markdownlint]
MD033 = false # WHY: Allow inline HTML such as details, summary, iframe, and video.

# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all repository tooling with the canonical `uv sync`.
default-groups = "all"

# WHY: Give a bit of time to find hijacked releases before installing.
# CUSTOM: Should match `uvx prek update --freeze --cooldown-days 7`.
exclude-newer = "7 days"

# WHY: Repository tooling updates must be usable immediately.
exclude-newer-package = {se-theory-reference-kit = false}


# ============================================================
# SECTION 3: BUILD SYSTEM (boilerplate; CUSTOM src/ agreement)
# ============================================================
#
# REQ.PROJECT: A build system MUST be declared for package discovery and publishing.
# REQ.STRUCTURE: All importable code MUST live under src/.
# WHY src/ layout: Prevents accidental imports from the repo root;
# ensures consistent behavior across IDEs, tests, CI, and PyPI.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.build.hooks.vcs]
# WHY: Writes computed version into src/*/_version.py at build time.
# CUSTOM: Must match src/ folders.
version-file = "src/se_interpretive_kernel/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/se_interpretive_kernel",
  "CHANGELOG.md",
  "CITATION.cff",
  "LICENSE",
  "README.md",
  "SE_MANIFEST.toml",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/se_interpretive_kernel"]

[tool.hatch.version]
# Used when no git tags present (fresh clone, CI). Keep in sync with CITATION.cff.
fallback-version = "0.1.0"
# WHY: Version derived from git tags at build time.
source = "vcs"
# WHY: Allow hatch-vcs to find the Git root when built from a subdirectory,
# temporary build directory, or isolated build env.
search_parent_directories = true
tag-pattern = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
